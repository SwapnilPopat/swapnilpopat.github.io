name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify site integrity
        run: |
          test -f index.html
          test -f 404.html
          test -f assets/css/style.css
          test -f assets/js/main.js
          echo "Site integrity check passed."
